<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bookchop - Annotator</title>
    <link href="./dist/output.css" rel="stylesheet">
</head>
<body class="bg-gray-100">
    <div class="container mx-auto p-4">
        <h1 class="text-2xl font-bold mb-4">Bookchop Annotator</h1>

        <div class="mb-4">
            <label for="pdf-upload" class="block text-sm font-medium text-gray-700">Upload PDF:</label>
            <input type="file" id="pdf-upload" accept=".pdf" class="mt-1 block w-full text-sm text-gray-900 border border-gray-300 rounded-lg cursor-pointer bg-gray-50 focus:outline-none">
        </div>

        <div id="pdf-container" class="bg-white border border-gray-300 rounded-lg shadow-sm" style="position: relative;">
            <!-- PDF pages will be rendered here -->
        </div>

        <div class="mt-4">
            <button id="save-annotations" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-opacity-50">
                Save Annotations
            </button>
        </div>
    </div>
    <script src="./lib/pdf.mjs"></script>
    <script type="module" src="./dist/annotator.js"></script>
</body>
</html>
