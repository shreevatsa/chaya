<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bookchop - Annotator</title>
    <link href="./dist/output.css" rel="stylesheet">
</head>
<body class="bg-gray-100">
    <div class="container mx-auto p-4">
        <h1 class="text-2xl font-bold mb-4">Bookchop Annotator</h1>

        <div class="mb-4">
            <label for="pdf-upload" class="block text-sm font-medium text-gray-700">Upload PDF:</label>
            <input type="file" id="pdf-upload" accept=".pdf" class="mt-1 block w-full text-sm text-gray-900 border border-gray-300 rounded-lg cursor-pointer bg-gray-50 focus:outline-none">
        </div>

        <div class="mb-4">
            <label for="annotations-upload" class="block text-sm font-medium text-gray-700">Load Existing Annotations (optional):</label>
            <input type="file" id="annotations-upload" accept=".json" class="mt-1 block w-full text-sm text-gray-900 border border-gray-300 rounded-lg cursor-pointer bg-gray-50 focus:outline-none">
            <p class="mt-1 text-xs text-gray-500">Upload a .json file to load previously saved annotations</p>
        </div>

        <div class="flex gap-4" style="height: 70vh;">
            <!-- Main PDF Container -->
            <div class="flex-1">
                <div id="pdf-container" class="bg-white border border-gray-300 rounded-lg shadow-sm h-full overflow-y-auto p-4" style="position: relative;">
                    <!-- PDF pages will be rendered here -->
                </div>
            </div>

            <!-- Annotation Management Sidebar -->
            <div class="w-80 bg-white border border-gray-300 rounded-lg shadow-sm p-4 h-full flex flex-col">
                <h2 class="text-lg font-bold mb-3 text-gray-900">Annotations</h2>
                <div id="annotation-count" class="text-sm text-gray-500 mb-3">
                    No annotations
                </div>
                <div id="annotation-list" class="space-y-2 flex-1 overflow-y-auto">
                    <!-- Annotation items will be added here -->
                </div>
            </div>
        </div>

        <div class="mt-4">
            <button id="save-annotations" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-opacity-50">
                Save Annotations
            </button>
        </div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script type="module" src="./dist/annotator.js"></script>
</body>
</html>
