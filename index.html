<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chaya</title>
    <link href="./dist/output.css" rel="stylesheet">
</head>

<body class="bg-gray-100">
    <div class="container mx-auto p-4">
        <!-- App header (Upload/Download) -->
        <header class="mb-6">
            <h1 class="text-lg font-bold mb-4">Chaya</h1>

            <!-- Upload/download .chaya and .pdf -->
            <div class="bg-white rounded-lg p-6 shadow-sm mb-4">
                <h2 class="text-lg font-medium mb-4">Document</h2>
                <div id="document-filename" class="text-sm text-gray-600 mb-4 hidden">
                    No document loaded
                </div>

                <div class="flex gap-6 justify-center">
                    <!-- .chaya slot -->
                    <div id="chaya-slot" class="flex-1 max-w-xs">
                        <div class="upload-slot border-2 border-dashed border-gray-300 rounded-lg p-8 text-center hover:border-blue-400 hover:bg-blue-50 transition-colors cursor-pointer">
                            <div class="text-4xl mb-3">📦</div>
                            <div class="text-sm font-medium text-gray-700 mb-1">Upload .chaya</div>
                            <div class="text-xs text-gray-500">Complete package</div>
                        </div>
                        <input type="file" id="chaya-upload" accept=".chaya" class="hidden">

                        <div class="download-slot hidden border-2 border-blue-500 bg-blue-50 rounded-lg p-8 text-center hover:bg-blue-100 transition-colors cursor-pointer">
                            <div class="text-4xl mb-3">📦</div>
                            <div class="text-sm font-medium text-blue-700 mb-1">Download .chaya</div>
                            <div class="text-xs text-blue-600">Complete package</div>
                        </div>
                    </div>

                    <!-- OR separator -->
                    <div class="flex items-center">
                        <div class="text-gray-400 font-medium">OR</div>
                    </div>

                    <!-- .pdf slot -->
                    <div id="pdf-slot" class="flex-1 max-w-xs">
                        <div class="upload-slot border-2 border-dashed border-gray-300 rounded-lg p-8 text-center hover:border-blue-400 hover:bg-blue-50 transition-colors cursor-pointer">
                            <div class="text-4xl mb-3">📄</div>
                            <div class="text-sm font-medium text-gray-700 mb-1">Upload .pdf</div>
                            <div class="text-xs text-gray-500">Start from scratch</div>
                        </div>
                        <input type="file" id="pdf-upload" accept=".pdf" class="hidden">

                        <div class="download-slot hidden border-2 border-gray-500 bg-gray-50 rounded-lg p-8 text-center hover:bg-gray-100 transition-colors cursor-pointer">
                            <div class="text-4xl mb-3">📄</div>
                            <div class="text-sm font-medium text-gray-700 mb-1">Download .pdf</div>
                            <div class="text-xs text-gray-600">Original document</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Loading Progress -->
            <div id="app-loading" class="bg-white border border-gray-300 rounded-lg shadow-sm p-6 mb-4 hidden">
                <div class="flex items-center justify-between mb-2">
                    <span id="app-loading-text" class="text-sm font-medium text-gray-700">Loading PDF...</span>
                    <span id="app-loading-percent" class="text-sm text-gray-500">0%</span>
                </div>
                <div class="w-full bg-gray-200 rounded-full h-2">
                    <div id="app-progress-bar" class="bg-blue-600 h-2 rounded-full transition-all duration-300" style="width: 0%"></div>
                </div>
                <div id="app-loading-details" class="text-xs text-gray-500 mt-2">Preparing to load PDF...</div>
            </div>

        </header>

        <!-- Main Content: Mark regions on PDF -->
        <div id="mark-tab">
            <div class="flex gap-4" style="height: 90vh;">
                <!-- Main PDF Container -->
                <div class="flex-1">
                    <div id="pdf-container" class="bg-white border border-gray-300 rounded-lg shadow-sm h-full overflow-y-auto p-4" style="position: relative;">
                        <div class="flex items-center justify-center h-full text-gray-500">
                            <div class="text-center">
                                <div class="text-4xl mb-4">📄</div>
                                <p>Load a PDF file to start chopping it up into marked regions</p>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Region Management Sidebar -->
                <div class="w-80 bg-white border border-gray-300 rounded-lg shadow-sm p-4 h-full flex flex-col">
                    <h2 class="text-lg font-bold mb-3 text-gray-900">Marked regions</h2>
                    <div id="annotation-list" class="flex-1 overflow-y-auto">
                        <!-- Annotation items will be added here -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script type="module" src="./dist/app.js"></script>
</body>

</html>
