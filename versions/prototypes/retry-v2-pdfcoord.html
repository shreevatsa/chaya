<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Region Annotator (PDF Coords)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.11.338/pdf.min.js"></script>
    <script>
        // Set worker source - IMPORTANT! Adjust the path if hosting pdf.worker.js locally
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.11.338/pdf.worker.min.js';
    </script>
    <style>
        /* Custom styles (same as v1) */
        body {
            font-family: 'Inter', sans-serif;
        }
        #pdf-container {
            position: relative;
            border: 1px solid #ccc;
            overflow-y: auto;
            margin: 0 auto;
        }
        #pdf-container canvas {
            display: block;
            margin: 10px auto;
            border: 1px solid #eee;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        /* Style for page rendering errors */
        .page-error {
             margin: 10px auto;
             padding: 10px;
             background-color: #fee2e2; /* Light red */
             border: 1px solid #f87171; /* Red border */
             color: #b91c1c; /* Dark red text */
             font-size: 0.9em;
             text-align: center;
        }
        #drawing-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            cursor: crosshair;
            z-index: 10;
        }
        .selection-box {
            position: absolute;
            border: 2px dashed red;
            background-color: rgba(255, 0, 0, 0.2);
            pointer-events: none;
            z-index: 5;
        }
        .annotation-box {
            position: absolute;
            border: 1px solid darkcyan;
            background-color: rgba(0, 139, 139, 0.1);
            pointer-events: none;
            z-index: 5;
            color: darkcyan;
            font-size: 10px;
            padding: 1px 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
    </style>
</head>
<body class="bg-gray-100 p-4 md:p-8">

    <div class="max-w-6xl mx-auto bg-white p-6 rounded-lg shadow-lg">
        <h1 class="text-2xl font-bold mb-4 text-center text-gray-700">PDF Region Annotator (PDF Coordinates)</h1>

        <div class="mb-4">
            <label for="pdf-upload" class="block text-sm font-medium text-gray-700 mb-1">Upload PDF:</label>
            <input type="file" id="pdf-upload" accept="application/pdf" class="block w-full text-sm text-gray-500
                file:mr-4 file:py-2 file:px-4
                file:rounded-md file:border-0
                file:text-sm file:font-semibold
                file:bg-blue-50 file:text-blue-700
                hover:file:bg-blue-100 cursor-pointer
            "/>
        </div>

        <div id="status" class="text-sm text-gray-600 mb-4">Select a PDF file to start.</div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="md:col-span-2 border border-gray-300 rounded-md p-2 bg-gray-50" style="max-height: 80vh; overflow-y: auto;">
                <div id="pdf-container">
                    <div id="drawing-overlay" style="display: none;"></div>
                    <div id="selection-box-visual" class="selection-box" style="display: none;"></div>
                     </div>
            </div>

            <div class="md:col-span-1">
                <h2 class="text-lg font-semibold mb-2 text-gray-700">Annotations</h2>
                <div id="annotations-list" class="space-y-2 mb-4 border border-gray-200 rounded-md p-3 bg-gray-50" style="max-height: 60vh; overflow-y: auto;">
                    <p class="text-xs text-gray-500">No annotations yet.</p>
                </div>
                <button id="export-json" class="w-full bg-green-500 hover:bg-green-600 text-white font-bold py-2 px-4 rounded-md transition duration-150 ease-in-out disabled:opacity-50 disabled:cursor-not-allowed" disabled>
                    Export Annotations (JSON)
                </button>
            </div>
        </div>
    </div>

    <script>
        // --- Global Variables ---
        const pdfUpload = document.getElementById('pdf-upload');
        const pdfContainer = document.getElementById('pdf-container');
        const drawingOverlay = document.getElementById('drawing-overlay');
        const selectionBoxVisual = document.getElementById('selection-box-visual');
        const annotationsList = document.getElementById('annotations-list');
        const exportButton = document.getElementById('export-json');
        const statusDiv = document.getElementById('status');

        let pdfDoc = null;
        let annotations = [];
        let isDrawing = false;
        let startCoords = { x: 0, y: 0 };
        let currentSelection = { page: 0 };
        const RENDER_SCALE = 1.5;
        let nextAnnotationId = 0;
        const viewportCache = {};

        // --- Event Listeners ---
        pdfUpload.addEventListener('change', handleFileSelect);
        drawingOverlay.addEventListener('mousedown', handleMouseDown);
        drawingOverlay.addEventListener('mousemove', handleMouseMove);
        drawingOverlay.addEventListener('mouseup', handleMouseUp);
        drawingOverlay.addEventListener('mouseleave', handleMouseLeave);
        exportButton.addEventListener('click', exportAnnotations);

        // --- Helper: Get Viewport (Cached) ---
        async function getViewport(pageNum) {
            // (Function remains the same as before)
            if (!pdfDoc) throw new Error("PDF not loaded");
            if (viewportCache[pageNum]) {
                return viewportCache[pageNum];
            }
            try {
                const page = await pdfDoc.getPage(pageNum);
                const viewport = page.getViewport({ scale: RENDER_SCALE });
                viewportCache[pageNum] = viewport;
                return viewport;
            } catch (error) {
                console.error(`Failed to get viewport for page ${pageNum}:`, error);
                throw error; // Re-throw to be caught by caller
            }
        }

        // --- Core Functions ---

        /**
         * Handles the PDF file selection.
         */
        async function handleFileSelect(event) {
            const file = event.target.files[0];
            if (!file || file.type !== 'application/pdf') {
                updateStatus('Please select a valid PDF file.', 'error');
                return;
            }

            resetState(); // Clear previous state first
            updateStatus('Loading PDF...', 'loading');

            try {
                const arrayBuffer = await file.arrayBuffer();
                const loadingTask = pdfjsLib.getDocument({ data: arrayBuffer });
                pdfDoc = await loadingTask.promise; // Assign global pdfDoc here
                updateStatus(`PDF loaded (${pdfDoc.numPages} pages). Rendering...`, 'loading');

                await renderAllPages(); // Render pages

                // Check if any pages failed to render (indicated by error divs)
                const pageErrors = pdfContainer.querySelectorAll('.page-error').length;
                 if (pageErrors === pdfDoc.numPages) {
                    // All pages failed
                    updateStatus(`Failed to render any pages. Please check console for errors.`, 'error');
                 } else if (pageErrors > 0) {
                    // Some pages failed
                     updateStatus(`PDF rendered with ${pageErrors} page errors. Ready to annotate.`, 'warning'); // Use a warning state if desired
                 } else {
                    // All pages rendered successfully
                    updateStatus(`PDF rendered. Ready to annotate.`, 'success');
                 }

                drawingOverlay.style.display = 'block'; // Enable drawing overlay

            } catch (error) {
                // Catch errors during getDocument or initial loading steps
                console.error('Error loading PDF:', error);
                updateStatus(`Error loading PDF: ${error.message}. Check console for details.`, 'error');
                // *** Removed resetState() call from here to keep the error message visible ***
            }
        }

        /**
         * Renders all pages of the loaded PDF document.
         * Now includes try...catch inside the loop for individual page errors.
         */
        async function renderAllPages() {
            pdfContainer.querySelectorAll('canvas, .annotation-box, .page-error').forEach(el => el.remove()); // Clear previous content
            viewportCache = {}; // Clear viewport cache

            const fragment = document.createDocumentFragment();
            let renderPromises = []; // Store promises for rendering

            for (let pageNum = 1; pageNum <= pdfDoc.numPages; pageNum++) {
                 // Wrap each page rendering attempt in its own try...catch
                 const renderPromise = (async () => { // IIAFE to handle async inside loop correctly
                    try {
                        const viewport = await getViewport(pageNum); // Use cached viewport helper
                        const canvas = document.createElement('canvas');
                        canvas.height = viewport.height;
                        canvas.width = viewport.width;
                        canvas.dataset.pageNum = pageNum;
                        const context = canvas.getContext('2d');

                        // Get page object for rendering
                        const page = await pdfDoc.getPage(pageNum);
                        const renderContext = { canvasContext: context, viewport: viewport };
                        await page.render(renderContext).promise;
                        fragment.appendChild(canvas); // Add successfully rendered canvas
                    } catch (pageError) {
                        console.error(`Error rendering page ${pageNum}:`, pageError);
                        // Create an error placeholder div for this specific page
                        const errorDiv = document.createElement('div');
                        errorDiv.className = 'page-error'; // Add class for styling
                        errorDiv.style.width = viewportCache[pageNum] ? `${viewportCache[pageNum].width}px` : '80%'; // Attempt to size similarly
                        errorDiv.style.height = viewportCache[pageNum] ? `${viewportCache[pageNum].height}px` : '100px';
                        errorDiv.textContent = `Error rendering page ${pageNum}. Check console.`;
                        fragment.appendChild(errorDiv); // Add error div to fragment
                    }
                 })();
                 renderPromises.push(renderPromise);
            }

            // Wait for all page rendering attempts to complete (or fail individually)
            await Promise.all(renderPromises);

            pdfContainer.appendChild(fragment); // Append all canvases/error divs at once
            adjustOverlaySize();
            await redrawAllAnnotationBoxes(); // Redraw annotations (now async)
        }

        /**
         * Adjusts the drawing overlay size.
         */
        function adjustOverlaySize() {
            drawingOverlay.style.width = `${pdfContainer.scrollWidth}px`;
            drawingOverlay.style.height = `${pdfContainer.scrollHeight}px`;
        }

        /**
         * Handles mouse down to start drawing.
         */
        function handleMouseDown(event) {
            // (Function remains the same as before)
            if (!pdfDoc || isDrawing) return;
            const rect = pdfContainer.getBoundingClientRect();
            startCoords.x = event.clientX - rect.left + pdfContainer.scrollLeft;
            startCoords.y = event.clientY - rect.top + pdfContainer.scrollTop;
            const targetCanvas = findCanvasAtCoords(startCoords.x, startCoords.y);
            if (!targetCanvas) return;
            isDrawing = true;
            currentSelection.page = parseInt(targetCanvas.dataset.pageNum);
            selectionBoxVisual.style.left = `${startCoords.x}px`;
            selectionBoxVisual.style.top = `${startCoords.y}px`;
            selectionBoxVisual.style.width = '0px';
            selectionBoxVisual.style.height = '0px';
            selectionBoxVisual.style.display = 'block';
            event.preventDefault();
        }

        /**
         * Handles mouse move to resize drawing.
         */
        function handleMouseMove(event) {
            // (Function remains the same as before)
             if (!isDrawing) return;
            const rect = pdfContainer.getBoundingClientRect();
            const currentX = event.clientX - rect.left + pdfContainer.scrollLeft;
            const currentY = event.clientY - rect.top + pdfContainer.scrollTop;
            const width = Math.abs(currentX - startCoords.x);
            const height = Math.abs(currentY - startCoords.y);
            const left = Math.min(currentX, startCoords.x);
            const top = Math.min(currentY, startCoords.y);
            selectionBoxVisual.style.left = `${left}px`;
            selectionBoxVisual.style.top = `${top}px`;
            selectionBoxVisual.style.width = `${width}px`;
            selectionBoxVisual.style.height = `${height}px`;
        }

        /**
         * Handles mouse up to finalize selection and store PDF coordinates.
         */
        async function handleMouseUp(event) {
            // (Function remains the same as before)
            if (!isDrawing) return;
            isDrawing = false;
            selectionBoxVisual.style.display = 'none';

            const rect = pdfContainer.getBoundingClientRect();
            const endX = event.clientX - rect.left + pdfContainer.scrollLeft;
            const endY = event.clientY - rect.top + pdfContainer.scrollTop;

            const boxX = Math.min(startCoords.x, endX);
            const boxY = Math.min(startCoords.y, endY);
            const boxWidth = Math.abs(endX - startCoords.x);
            const boxHeight = Math.abs(endY - startCoords.y);

            if (boxWidth < 5 || boxHeight < 5) {
                console.log("Selection too small, ignoring.");
                return;
            }

            const targetCanvas = pdfContainer.querySelector(`canvas[data-page-num="${currentSelection.page}"]`);
            if (!targetCanvas) {
                 console.error(`Could not find canvas for page ${currentSelection.page} during mouseup.`);
                 updateStatus(`Error: Could not find canvas for page ${currentSelection.page}.`, 'error');
                 return;
            }

            try {
                const viewport = await getViewport(currentSelection.page);

                const canvasOffsetX = targetCanvas.offsetLeft;
                const canvasOffsetY = targetCanvas.offsetTop;
                const relativeX = boxX - canvasOffsetX;
                const relativeY = boxY - canvasOffsetY;

                const topLeftCanvas = [relativeX, relativeY];
                const bottomRightCanvas = [relativeX + boxWidth, relativeY + boxHeight];

                const topLeftPdf = viewport.convertToPdfPoint(...topLeftCanvas);
                const bottomRightPdf = viewport.convertToPdfPoint(...bottomRightCanvas);

                const pdfX = Math.min(topLeftPdf[0], bottomRightPdf[0]);
                const pdfY = Math.min(topLeftPdf[1], bottomRightPdf[1]);
                const pdfWidth = Math.abs(topLeftPdf[0] - bottomRightPdf[0]);
                const pdfHeight = Math.abs(topLeftPdf[1] - bottomRightPdf[1]);

                const label = prompt(`Enter label for selection on Page ${currentSelection.page}:`);
                 if (label === null) {
                    updateStatus('Annotation cancelled.', 'info');
                    return;
                }
                 if (label.trim() === '') {
                     updateStatus('Annotation cancelled (empty label).', 'info');
                     return;
                 }

                const annotation = {
                    id: nextAnnotationId++,
                    page: currentSelection.page,
                    label: label.trim(),
                    pdfX: pdfX,
                    pdfY: pdfY,
                    pdfWidth: pdfWidth,
                    pdfHeight: pdfHeight
                };
                annotations.push(annotation);

                renderAnnotationsList();
                await drawAnnotationBox(annotation);
                updateStatus(`Annotation "${label}" added for page ${currentSelection.page}.`, 'success');
                exportButton.disabled = false;

            } catch (error) {
                console.error("Error converting coordinates or getting label:", error);
                updateStatus(`Error processing annotation: ${error.message}`, 'error');
            }
        }

        /**
         * Handles mouse leave to cancel drawing.
         */
        function handleMouseLeave() {
            // (Function remains the same as before)
             if (isDrawing) {
                isDrawing = false;
                selectionBoxVisual.style.display = 'none';
                updateStatus('Drawing cancelled (mouse left area).', 'info');
            }
        }

        /**
         * Finds canvas at given container coordinates.
         */
        function findCanvasAtCoords(x, y) {
            // (Function remains the same as before)
             const canvases = pdfContainer.querySelectorAll('canvas');
            for (const canvas of canvases) {
                const canvasTop = canvas.offsetTop;
                const canvasLeft = canvas.offsetLeft;
                const canvasBottom = canvasTop + canvas.offsetHeight;
                const canvasRight = canvasLeft + canvas.offsetWidth;
                if (x >= canvasLeft && x <= canvasRight && y >= canvasTop && y <= canvasBottom) {
                    return canvas;
                }
            }
            return null;
        }

        /**
         * Draws a single annotation box, converting PDF points to canvas pixels.
         */
        async function drawAnnotationBox(annotation) {
            // (Function remains the same as before)
             const targetCanvas = pdfContainer.querySelector(`canvas[data-page-num="${annotation.page}"]`);
            if (!targetCanvas) {
                // Don't warn if the target is an error div instead of a canvas
                if (!pdfContainer.querySelector(`.page-error[data-page-num="${annotation.page}"]`)) {
                     console.warn(`Canvas not found for page ${annotation.page} when drawing box.`);
                }
                return; // Cannot draw box if canvas doesn't exist
            }

            try {
                const viewport = await getViewport(annotation.page);

                const topLeftPdf = [annotation.pdfX, annotation.pdfY];
                const bottomRightPdf = [annotation.pdfX + annotation.pdfWidth, annotation.pdfY + annotation.pdfHeight];

                const topLeftCanvas = viewport.convertToViewportPoint(...topLeftPdf);
                const bottomRightCanvas = viewport.convertToViewportPoint(...bottomRightPdf);

                const canvasX = Math.min(topLeftCanvas[0], bottomRightCanvas[0]);
                const canvasY = Math.min(topLeftCanvas[1], bottomRightCanvas[1]);
                const canvasWidth = Math.abs(topLeftCanvas[0] - bottomRightCanvas[0]);
                const canvasHeight = Math.abs(topLeftCanvas[1] - bottomRightCanvas[1]);

                const canvasTopOffset = targetCanvas.offsetTop;
                const canvasLeftOffset = targetCanvas.offsetLeft;

                const box = document.createElement('div');
                box.className = 'annotation-box';
                box.dataset.annotationId = annotation.id;
                box.style.left = `${canvasLeftOffset + canvasX}px`;
                box.style.top = `${canvasTopOffset + canvasY}px`;
                box.style.width = `${canvasWidth}px`;
                box.style.height = `${canvasHeight}px`;
                box.title = `Page ${annotation.page}: ${annotation.label} (PDF Coords)`;
                box.textContent = annotation.label;

                pdfContainer.appendChild(box);
            } catch (error) {
                console.error(`Error drawing annotation box for ID ${annotation.id}:`, error);
            }
        }

        /**
         * Redraws all annotation boxes. Now async.
         */
        async function redrawAllAnnotationBoxes() {
            pdfContainer.querySelectorAll('.annotation-box').forEach(box => box.remove());
            let drawPromises = annotations.map(anno => drawAnnotationBox(anno)); // Create all promises
            await Promise.all(drawPromises); // Wait for all to complete
        }


        /**
         * Renders the list of annotations, showing PDF coordinates.
         */
        function renderAnnotationsList() {
            // (Function remains the same as before)
             if (annotations.length === 0) {
                annotationsList.innerHTML = '<p class="text-xs text-gray-500">No annotations yet.</p>';
                return;
            }

            annotationsList.innerHTML = '';
            annotations.sort((a, b) => {
                if (a.page !== b.page) return a.page - b.page;
                return a.label.localeCompare(b.label);
            });

            annotations.forEach((anno) => {
                const listItem = document.createElement('div');
                listItem.className = 'p-2 border-b border-gray-100 text-sm';
                listItem.innerHTML = `
                    <span class="font-medium text-cyan-700">Pg ${anno.page}: ${anno.label}</span>
                    <span class="text-xs text-gray-500 block">
                        (x: ${anno.pdfX.toFixed(1)}, y: ${anno.pdfY.toFixed(1)}, w: ${anno.pdfWidth.toFixed(1)}, h: ${anno.pdfHeight.toFixed(1)}) [PDF pts]
                    </span>
                    <button data-id="${anno.id}" class="text-red-500 hover:text-red-700 text-xs float-right font-semibold" onclick="deleteAnnotation(this)">Delete</button>
                `;
                annotationsList.appendChild(listItem);
            });
        }

         /**
         * Deletes an annotation by its unique ID.
         */
         function deleteAnnotation(button) {
             // (Function remains the same as before)
             const idToDelete = parseInt(button.dataset.id);
            if (isNaN(idToDelete)) return;
            const indexToDelete = annotations.findIndex(anno => anno.id === idToDelete);
            if (indexToDelete === -1) return;
            const deletedAnnotation = annotations.splice(indexToDelete, 1)[0];
            const boxToRemove = pdfContainer.querySelector(`.annotation-box[data-annotation-id="${idToDelete}"]`);
            if (boxToRemove) boxToRemove.remove();
            renderAnnotationsList();
            updateStatus(`Annotation "${deletedAnnotation.label}" deleted.`, 'info');
            if (annotations.length === 0) exportButton.disabled = true;
         }


        /**
         * Exports the annotations array (now with PDF coords) as JSON.
         */
        function exportAnnotations() {
            // (Function remains the same as before)
             if (annotations.length === 0) {
                updateStatus('No annotations to export.', 'info');
                return;
            }
            const jsonString = JSON.stringify(annotations, null, 2);
            const blob = new Blob([jsonString], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            const originalFileName = pdfUpload.files[0]?.name.replace(/\.pdf$/i, '') || 'annotations';
            a.download = `${originalFileName}_pdf_coords_annotations.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            updateStatus('Annotations exported.', 'success');
        }

        /**
         * Updates the status message area.
         */
        function updateStatus(message, type = 'info') {
            // (Function remains the same as before)
             statusDiv.textContent = message;
            statusDiv.className = 'text-sm mb-4 '; // Reset classes
            switch (type) {
                case 'success': statusDiv.classList.add('text-green-600'); break;
                case 'error': statusDiv.classList.add('text-red-600', 'font-semibold'); break;
                case 'warning': statusDiv.classList.add('text-yellow-600'); break; // Added warning style
                case 'loading': statusDiv.classList.add('text-blue-600'); break;
                default: statusDiv.classList.add('text-gray-600'); break; // info
            }
        }

        /**
         * Resets the application state.
         */
        function resetState() {
            // (Function remains the same as before)
             pdfDoc = null;
            annotations = [];
            nextAnnotationId = 0;
            viewportCache = {};
            pdfContainer.querySelectorAll('canvas, .annotation-box, .page-error').forEach(el => el.remove()); // Also remove error divs
            if (!pdfContainer.contains(drawingOverlay)) pdfContainer.appendChild(drawingOverlay);
            if (!pdfContainer.contains(selectionBoxVisual)) pdfContainer.appendChild(selectionBoxVisual);
            drawingOverlay.style.display = 'none';
            selectionBoxVisual.style.display = 'none';
            renderAnnotationsList();
            exportButton.disabled = true;
            updateStatus('Select a PDF file to start.'); // Set initial status
        }

    </script>

</body>
</html>
